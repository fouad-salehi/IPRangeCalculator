<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta name="description" content="IP Range Calculator — a browser-based VLSM and subnet planner that automatically allocates IP ranges based on required hosts per network.">
    <meta name="keywords" content="IP Range Calculator, VLSM, subnet planner, subnet calculator, CIDR, IP allocation, network planning, VLSM calculator, subnetting">
    <meta name="author" content="Fouad Salehi">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0b1220">
    <link rel="canonical" href="https://iprangecalculator.web.app/">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="IP Range Calculator">
    <meta property="og:title" content="IP Range Calculator — VLSM & Subnet Planner">
    <meta property="og:description" content="Automatically allocate IP ranges based on required hosts per network. Fully client-side VLSM and subnet planning tool.">
    <meta property="og:url" content="https://iprangecalculator.web.app/">
    <meta property="og:image" content="https://iprangecalculator.web.app/assets/images/brandmark.png">
    <meta property="og:image:alt" content="IP Range Calculator">
    <meta property="og:locale" content="en_US">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Range Calculator — VLSM & Subnet Planner</title>
    <link rel="stylesheet" href="./assets/css/variables.css">
    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/components.css">
    <link rel="stylesheet" href="./assets/css/responsive.css">
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-title">
          <h1>IP Range Calculator</h1>
          <span class="subtitle">VLSM &amp; Subnet Planner</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>
      </header>

      <div class="card">
        <div class="card-title">Base Network</div>
        <input type="text" id="baseNetwork" class="mono" value="192.168.1.0/24" placeholder="192.168.1.0/24">
      </div>

      <div class="card">
        <div class="card-title">Add Network</div>
        <div class="add-row">
          <div>
            <label>Network Name</label>
            <input type="text" id="netName" placeholder="VLAN10">
          </div>
          <div>
            <label>Required Hosts</label>
            <input type="number" id="hostCount" min="1" placeholder="50">
          </div>
          <button class="btn btn-primary" type="button">+ Add</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Networks</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:40px;">#</th>
                <th>Name</th>
                <th>Hosts</th>
                <th style="width:180px;">Order</th>
                <th style="width:80px;">Action</th>
              </tr>
            </thead>
            <tbody id="netList">
              <tr><td colspan="5" class="empty">No networks added yet</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Result</div>
        <div id="resultStats" class="stats"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Network</th>
                <th>Mask</th>
                <th>Usable Range</th>
                <th>Broadcast</th>
              </tr>
            </thead>
            <tbody id="resultList">
              <tr><td colspan="5" class="empty">Results will appear here</td></tr>
            </tbody>
          </table>
        </div>
        <div class="error" id="errorMsg"></div>
      </div>
    </div>
